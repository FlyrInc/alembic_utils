name: Tests

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
        matrix:
            python-version: ['3.6', '3.7', '3.8', '3.9']
            postgres-version: ['10', '11', '12', '13']

    services:

      postgres:
        image: postgres:${{ matrix.postgres-version }}
        env:
          POSTGRES_DB: alem_db
          POSTGRES_HOST: localhost
          POSTGRES_USER: alem_user
          POSTGRES_PASSWORD: password
        ports:
        - 5610:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
    - uses: actions/checkout@50fbc622fc4ef5163becd7fab6573eac35f8462e # v1
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@0f07f7f756721ebd886c2462646a35f78a8bc4de # v1
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install
      run: |
        pip install --upgrade pip
        pip install wheel
        pip install -e ".[dev]"

    - name: Test with Coverage
      run: |
        pytest --cov=alembic_utils src/test --cov-report=xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@29386c70ef20e286228c72b668a06fd0e8399192 # v1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: true
